# Test profile — points at the same PostgreSQL instance used by the app.
# Pass DB_PASSWORD as a system property (-DDB_PASSWORD=...) or env var.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartqueue}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:smartqueue_user}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ML service — unreachable in tests; mock always returns null
smartqueue.ml.base-url=http://127.0.0.1:1
