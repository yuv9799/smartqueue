spring.application.name=SmartQueue
server.port=8080

# PostgreSQL datasource
# Override any of these with environment variables:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartqueue}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:smartqueue_user}
spring.datasource.password=${DB_PASSWORD:}

# JPA and Hibernate
# update: creates/updates tables to match entities on startup (safe for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# PostgreSQL dialect is auto-detected — no explicit dialect needed

# ML sidecar service (SmartQueue ML Service)
# Override with environment variable: ML_SERVICE_URL
smartqueue.ml.base-url=${ML_SERVICE_URL:http://localhost:8001}

# H2 console — DISABLED (using PostgreSQL instead)
spring.h2.console.enabled=false

# Do not expose long Java stack traces in the browser
server.error.include-stacktrace=never
server.error.include-message=always
